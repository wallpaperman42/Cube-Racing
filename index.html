<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000}#hud span{background:#0b1227bb;padding:10px 14px;border:1px solid #ffffff22;border-radius:12px}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#060b18bb;backdrop-filter:blur(5px)}#panel{background:#10182de8;border:1px solid #ffffff2b;border-radius:24px;padding:32px;text-align:center;max-width:420px;width:90%;box-shadow:0 18px 70px #0009}h1{font-size:38px;margin:0 0 8px;color:#ff8b39}p{color:#bdc8dc;line-height:1.6}button{background:#fa6518;color:white;border:0;border-radius:14px;padding:13px 25px;font-weight:800;cursor:pointer}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px}#controls button{min-width:64px;touch-action:manipulation;background:#1e345acc;border:1px solid #ffffff30}#status{position:fixed;bottom:92px;width:100%;text-align:center;font-size:12px;color:#b4c8dd;pointer-events:none}
</style>
<script src="https://cdn.jsdelivr.net/gh/acubemy/plugin-sdk@1/v1.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="score">SCORE 0</span><span id="speed">SPEED 0</span><span id="lives">❤ ❤ ❤</span></div>
<div id="menu"><div id="panel"><h1>🏎️ CUBE RACING</h1><p id="message">Dodge traffic, collect golden coins and survive!<br>Cube: R = right · L = left · U = boost · F = jump<br>Keyboard: ← → · ↑ boost · Space jump</p><button id="start">START RACE</button></div></div>
<div id="status">Connect your smart cube in acubemy, or play with keyboard / buttons.</div>
<div id="controls"><button data-act="left">◀</button><button data-act="boost">⚡</button><button data-act="jump">⬆</button><button data-act="right">▶</button></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let running=false,lane=1,obstacles=[],score=0,lives=3,elapsed=0,spawn=0,boost=0,jump=0,invuln=0,roadOffset=0,last=0;
function start(){running=true;lane=1;obstacles=[];score=0;lives=3;elapsed=0;spawn=0;boost=0;jump=0;invuln=0;roadOffset=0;$('menu').style.display='none'}
function end(){running=false;$('menu').style.display='grid';$('panel').querySelector('h1').textContent='🏁 RACE OVER';$('message').textContent='Final score: '+Math.floor(score)+' — race again to beat your record!';$('start').textContent='RACE AGAIN'}
function act(a){if(!running)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='boost')boost=1.6;if(a==='jump'&&jump<=0)jump=.85}
$('start').onclick=start;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
addEventListener('keydown',e=>{const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'boost',w:'boost',' ':'jump'};if(map[e.key]){e.preventDefault();act(map[e.key])}if(e.key==='Enter'&&!running)start()});
if(window.acubemy){acubemy.onMove(({face})=>{const map={L:'left',R:'right',U:'boost',F:'jump'};if(map[face])act(map[face])});acubemy.onDeviceChange(d=>{$('status').textContent=d.connected?'Smart cube connected: '+(d.deviceName||'Ready'):'Cube disconnected — keyboard controls available'});}
function polygon(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function roadX(l,y){let t=(y-H*.18)/(H*.82),width=W*(.10+.40*Math.max(0,t));return W/2+(l-1)*width*.57}
function render(dt){const horizon=H*.18,base=H*.98;ctx.fillStyle='#080e23';ctx.fillRect(0,0,W,H);const glow=ctx.createLinearGradient(0,0,0,H);glow.addColorStop(0,'#151c49');glow.addColorStop(1,'#28123c');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
for(let i=0;i<16;i++){const x=i*W/15,y=horizon-20-(i%4)*13;ctx.fillStyle=i%2?'#19345d':'#142d51';ctx.fillRect(x,y,Math.max(12,W/18),horizon-y)}
polygon([[W*.45,horizon],[W*.55,horizon],[W*.94,base],[W*.06,base]],'#111a30');polygon([[W*.45,horizon],[W*.452,horizon],[W*.065,base],[W*.055,base]],'#ff4b81');polygon([[W*.548,horizon],[W*.55,horizon],[W*.945,base],[W*.935,base]],'#30dcff');
for(let k=1;k<3;k++)for(let i=0;i<12;i++){let p=((i/12+roadOffset)%1),y=horizon+(p*p)*(base-horizon),x=W/2+(k-1.5)*(.10+.40*p)*W*.57;ctx.fillStyle='#ffffff65';ctx.fillRect(x-2,y,4,Math.max(4,25*p))}
for(const o of obstacles){const p=o.z,y=horizon+p*p*(base-horizon),x=roadX(o.lane,y),s=10+65*p;ctx.save();ctx.translate(x,y);if(o.type==='coin'){ctx.fillStyle='#ffd34a';ctx.beginPath();ctx.ellipse(0,-s*.5,s*.30,s*.43,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff2a3';ctx.lineWidth=3;ctx.stroke()}else{ctx.fillStyle=o.type==='barrier'?'#fa4d8a':'#42caff';ctx.fillRect(-s*.5,-s,s,s);ctx.fillStyle='#ffffff77';ctx.fillRect(-s*.33,-s*.8,s*.66,s*.18)}ctx.restore()}
const px=roadX(lane,base-85),py=base-55-(jump>0?Math.sin((1-jump/.85)*Math.PI)*85:0);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(px,base-45,37,12,0,0,7);ctx.fill();ctx.save();ctx.translate(px,py);if(invuln>0&&Math.floor(invuln*12)%2===0)ctx.globalAlpha=.35;ctx.fillStyle='#ff742b';ctx.fillRect(-29,-30,58,52);ctx.fillStyle='#ffd0a3';ctx.fillRect(-18,-20,36,18);ctx.fillStyle='#1b1b33';ctx.fillRect(-24,12,14,18);ctx.fillRect(10,12,14,18);ctx.restore();}
function tick(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(running){elapsed+=dt;boost=Math.max(0,boost-dt);jump=Math.max(0,jump-dt);invuln=Math.max(0,invuln-dt);let speed= .33+Math.min(elapsed*.004,.24)+(boost>0?.28:0);score+=dt*(boost>0?22:12);roadOffset=(roadOffset+dt*speed)%1;spawn-=dt;if(spawn<=0){spawn=.8+Math.random()*.45;obstacles.push({lane:Math.floor(Math.random()*3),z:0,type:Math.random()<.28?'coin':Math.random()<.35?'barrier':'car'})}for(const o of obstacles){o.z+=dt*speed;if(!o.hit&&o.z>.89&&o.z<1.08&&o.lane===lane){o.hit=true;if(o.type==='coin')score+=100;else if(invuln<=0&&(jump<=0||o.type!=='barrier')){lives--;invuln=1.2;if(lives<=0)end()}}}obstacles=obstacles.filter(o=>o.z<1.15);$('score').textContent='SCORE '+Math.floor(score);$('speed').textContent='SPEED '+Math.floor(speed*230);$('lives').textContent='❤ '.repeat(lives)||'0 LIVES'}render(dt);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
